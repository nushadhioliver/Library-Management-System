{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Edit Member - LibrarySys{% endblock %}
{% block content %}
<h1>Edit Member</h1>
<div class="card" style="max-width:480px;">
  <form method="POST" class="stacked">
    <div>
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required value="{{ member.Name }}">
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required value="{{ member.Email }}">
    </div>
    <div>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" value="{{ member.Phone or '' }}">
    </div>
    <div style="display:flex; gap:10px;">
      <button type="submit" class="btn">{{ icon('check') }}<span>Save Changes</span></button>
      <a class="btn btn-outline" href="{{ url_for('members.member_detail', member_id=member.Member_ID) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
