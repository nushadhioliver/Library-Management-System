{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Login - LibrarySys{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Welcome back</h1>
  <p class="subtitle" style="text-align:center;">Log in to your library account</p>

  <form method="POST" class="stacked">
    <div class="role-toggle">
      <label><input type="radio" name="role" value="member" checked>{{ icon('user') }}<span>Library Member</span></label>
      <label><input type="radio" name="role" value="admin">{{ icon('shield') }}<span>Administrator</span></label>
    </div>

    <div>
      <label for="email">Email</label>
      <div class="input-icon">{{ icon('mail') }}<input type="email" id="email" name="email" required autofocus></div>
    </div>
    <div>
      <label for="password">Password</label>
      <div class="input-icon">{{ icon('lock') }}<input type="password" id="password" name="password" required></div>
    </div>
    <button type="submit" class="btn">Log in</button>
  </form>

  <p class="auth-switch">
    New member? <a href="{{ url_for('auth.register') }}">Create an account</a>
  </p>
</div>
{% endblock %}
